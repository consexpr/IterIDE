<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ITER icon</title>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.09  0 0 0 0.10 0"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#F3EDE2"/>
    <g transform="translate(-34 0)">

    <!-- orbit of the i's dot -->
    <circle cx="156" cy="116" r="46" fill="none" stroke="#1E1B18" stroke-opacity="0.6"
            stroke-width="5" stroke-linecap="round" stroke-dasharray="0 12"/>
    <circle cx="185.6" cy="80.8" r="8" fill="none" stroke="#1E1B18" stroke-width="4"/>
    <circle cx="199.2" cy="131.7" r="13" fill="#F0A830"/>
    <circle cx="156" cy="162" r="24" fill="#E4572E"/>

    <!-- "it": the iterator -->
    <g fill="none" stroke="#1E1B18" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
      <path d="M156 234 V410"/>
      <path d="M284 146 V370 Q284 410 324 410 H340"/>
      <path d="M244 234 H356"/>
    </g>

    <!-- the crossbar continues as a dotted guide, pointing to the next step -->
    <g fill="#1E1B18" fill-opacity="0.6"><circle cx="400" cy="234" r="5.5"/><circle cx="421" cy="234" r="5.5"/></g>
    <path d="M442 208 L468 234 L442 260" fill="none" stroke="#E4572E" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect width="512" height="512" fill="none" filter="url(#grain)"/>
  </g>
</svg>
